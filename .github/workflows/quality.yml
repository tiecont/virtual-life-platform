name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: --max-old-space-size=12288
jobs:
  plan:
    name: change-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.28.5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - id: plan
        run: node scripts/artifact-plan.mjs >> "$GITHUB_OUTPUT"

  core:
    name: core-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      groups: ${{ steps.browser-plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Historical evidence objects must survive current-tree cleanup.
      - uses: pnpm/action-setup@v5 # v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v5 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore Next.js incremental build cache
        uses: actions/cache@v5
        with:
          path: |
            apps/portal-web/.next/cache
            apps/admin-web/.next/cache
          key: ${{ runner.os }}-next-core-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-next-core-
      - name: Restore prepared legacy API baselines
        uses: actions/cache@v5
        with:
          path: artifacts/legacy-runtime
          key: ${{ runner.os }}-legacy-runtime-${{ hashFiles('integrations/legacy-snapshots/**','scripts/prepare-deadline-baseline.mjs','scripts/prepare-maid-baseline.mjs','.node-version') }}
          restore-keys: |
            ${{ runner.os }}-legacy-runtime-
      - run: pnpm install --frozen-lockfile
      - name: Prepare selected Deadline baseline in isolated copy
        run: node scripts/prepare-deadline-baseline.mjs --allow-network
      - name: Prepare selected Maid foundation in isolated copy
        run: node scripts/prepare-maid-baseline.mjs --allow-network
      - id: browser-plan
        run: node scripts/ci-browser-plan.mjs >> "$GITHUB_OUTPUT"
      - name: Verify disposable test isolation and cleanup
        run: node scripts/test-harness-smoke.mjs
      - name: Verify engineering harness and checkpoint recovery
        run: pnpm test:harness
      - name: Verify split Playwright configuration
        run: pnpm playwright:config:check
      - name: Verify owner-design intake integrity and gates
        run: |
          python3 -m venv artifacts/ci/design-intake-venv
          artifacts/ci/design-intake-venv/bin/python -m pip install -r scripts/art/requirements.txt
          artifacts/ci/design-intake-venv/bin/python -m unittest discover -s tests/art -p 'test_*.py'
      - name: Lint,types,governance,unit and builds
        run: |
          mkdir -p artifacts/ci/core
          set -o pipefail
          pnpm check:core 2>&1 | tee artifacts/ci/core/check.log
      - uses: actions/upload-artifact@v5 # v4
        if: ${{ always() }}
        with:
          name: core-evidence
          path: artifacts/ci/core/
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: integration (${{ matrix.shard }}/4)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: aetheria_soulbound_test
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: aetheria_soulbound_test
          # Concurrent isolated schema migrations hold locks on their relation indexes.
          POSTGRES_INITDB_ARGS: "--set=max_locks_per_transaction=256"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aetheria_soulbound_test -d aetheria_soulbound_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://aetheria_soulbound_test:ci_ephemeral_only@127.0.0.1:5432/aetheria_soulbound_test
      # Shard 4 exhausted PostgreSQL's lock table ("out of shared memory") with
      # four workers. Two keeps the same tests below that infrastructure limit.
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v5 # v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v5 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore prepared legacy API baselines
        uses: actions/cache@v5
        with:
          path: artifacts/legacy-runtime
          key: ${{ runner.os }}-legacy-runtime-${{ hashFiles('integrations/legacy-snapshots/**','scripts/prepare-deadline-baseline.mjs','scripts/prepare-maid-baseline.mjs','.node-version') }}
          restore-keys: |
            ${{ runner.os }}-legacy-runtime-
      - name: Prepare selected legacy API baselines
        run: |
          node scripts/prepare-deadline-baseline.mjs --allow-network
          node scripts/prepare-maid-baseline.mjs --allow-network
      - run: pnpm build:packages
      - run: pnpm --filter @aetheria/platform-api build
      - name: Run PostgreSQL integration shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/integration
          set -o pipefail
          node scripts/with-test-db.mjs pnpm exec vitest run --project integration \
            --shard="${{ matrix.shard }}/4" \
            --reporter=json \
            --outputFile="artifacts/ci/integration/shard-${{ matrix.shard }}.json" \
            2>&1 | tee "artifacts/ci/integration/shard-${{ matrix.shard }}.log"
      - uses: actions/upload-artifact@v5 # v4
        if: ${{ always() }}
        with:
          name: integration-report-${{ matrix.shard }}
          path: artifacts/ci/integration/
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: browser (${{ matrix.group }})
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.core.outputs.groups || '["invalid-plan"]') }}
    env:
      CI_BROWSER_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v5 # v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v5 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore pinned Playwright browser and font cache
        uses: actions/cache@v5
        with:
          path: artifacts/ci-browser
          key: ${{ runner.os }}-playwright-1.64.1-${{ hashFiles('package.json','scripts/prepare-ci-browser.mjs') }}
          restore-keys: |
            ${{ runner.os }}-playwright-1.64.1-
      - name: Restore Next.js incremental build cache
        uses: actions/cache@v5
        with:
          path: |
            apps/portal-web/.next/cache
            apps/admin-web/.next/cache
          key: ${{ runner.os }}-next-browser-${{ matrix.group }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-next-browser-${{ matrix.group }}-
            ${{ runner.os }}-next-browser-
      - name: Restore prepared legacy API baselines
        uses: actions/cache@v5
        with:
          path: artifacts/legacy-runtime
          key: ${{ runner.os }}-legacy-runtime-${{ hashFiles('integrations/legacy-snapshots/**','scripts/prepare-deadline-baseline.mjs','scripts/prepare-maid-baseline.mjs','.node-version') }}
          restore-keys: |
            ${{ runner.os }}-legacy-runtime-
      - run: pnpm install --frozen-lockfile
      - name: Prepare selected Deadline baseline for legacy browser group
        if: ${{ matrix.group == 'legacy' }}
        run: node scripts/prepare-deadline-baseline.mjs --allow-network
      - run: pnpm build
      - run: node scripts/prepare-ci-browser.mjs
      # Each spec/device still gets a disposable DB/API;never combine IP budgets.
      - run: pnpm ci:browser "$CI_BROWSER_GROUP"
      - uses: actions/upload-artifact@v5 # v4
        if: ${{ always() }}
        with:
          name: browser-${{ matrix.group }}-evidence
          path: |
            playwright-report/ci/${{ matrix.group }}/
            test-results/ci/${{ matrix.group }}/
            artifacts/ci/${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 7

  images:
    name: runtime-images
    needs: plan
    if: ${{ needs.plan.outputs.images == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.28.5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore pinned Playwright browser and font cache
        uses: actions/cache@v5
        with:
          path: artifacts/ci-browser
          key: ${{ runner.os }}-playwright-1.64.1-${{ hashFiles('package.json','scripts/prepare-ci-browser.mjs') }}
          restore-keys: |
            ${{ runner.os }}-playwright-1.64.1-
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-ci-browser.mjs
      # Image smoke drivers import compiled shared contracts on the host too.
      - run: pnpm build:packages
      - run: node scripts/release-bundle.mjs --output artifacts/release-bundle
      - name: Verify local Compose from the tested web and API images
        run: node scripts/local-compose-smoke.mjs --bundle artifacts/release-bundle/bundle.json
      - name: Preserve image failure summaries
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: image-failure-summaries-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/image-*/facts.json
            artifacts/image-*/commands.json
            artifacts/image-*/smoke/result.json
            artifacts/image-*/smoke/commands.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v5
        with:
          name: verified-image-metadata-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release-bundle/metadata/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v5
        with:
          name: runtime-images-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release-bundle/
          if-no-files-found: error
          retention-days: 1

  quality:
    name: quality
    needs: [plan, core, integration, browser, images]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v5 # v4
        with:
          pattern: integration-report-*
          path: artifacts/ci/integration-reports
          merge-multiple: true
      - name: Verify all integration shards passed without skipped tests
        run: node scripts/verify-vitest-reports.mjs artifacts/ci/integration-reports
      - run: node scripts/artifact-gate.mjs
