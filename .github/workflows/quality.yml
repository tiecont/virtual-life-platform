name: Quality
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  plan:
    name: change-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - id: plan
        run: node scripts/artifact-plan.mjs >> "$GITHUB_OUTPUT"

  core:
    name: core-checks
    runs-on: ubuntu-24.04
    # 770 integration cases took20minutes;leave bounded time for checks/builds.
    timeout-minutes: 45
    outputs:
      groups: ${{ steps.browser-plan.outputs.groups }}
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: virtual_city_test
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: virtual_city_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U virtual_city_test -d virtual_city_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://virtual_city_test:ci_ephemeral_only@127.0.0.1:5432/virtual_city_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Historical evidence objects must survive current-tree cleanup.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare selected Deadline baseline in isolated copy
        run: node scripts/prepare-deadline-baseline.mjs --allow-network
      - name: Prepare selected Maid foundation in isolated copy
        run: node scripts/prepare-maid-baseline.mjs --allow-network
      - id: browser-plan
        run: node scripts/ci-browser-plan.mjs >> "$GITHUB_OUTPUT"
      - name: Verify disposable test isolation and cleanup
        run: node scripts/test-harness-smoke.mjs
      - name: Lint,types,unit,integration and builds
        run: |
          mkdir -p artifacts/ci/core
          set -o pipefail
          pnpm check 2>&1 | tee artifacts/ci/core/check.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: core-evidence
          path: artifacts/ci/core/
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: browser (${{ matrix.group }})
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: ${{ fromJSON(needs.core.outputs.groups || '["invalid-plan"]') }}
    env:
      CI_BROWSER_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare selected Deadline baseline for legacy browser group
        if: ${{ matrix.group == 'legacy' }}
        run: node scripts/prepare-deadline-baseline.mjs --allow-network
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Each spec/device still gets a disposable DB/API;never combine IP budgets.
      - run: pnpm ci:browser "$CI_BROWSER_GROUP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: browser-${{ matrix.group }}-evidence
          path: |
            playwright-report/ci/${{ matrix.group }}/
            test-results/ci/${{ matrix.group }}/
            artifacts/ci/${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 7

  images:
    name: runtime-images
    needs: plan
    if: ${{ needs.plan.outputs.images == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Image smoke drivers import compiled shared contracts on the host too.
      - run: pnpm build:packages
      - run: node scripts/release-bundle.mjs --output artifacts/release-bundle
      - name: Verify local Compose from the tested web and API images
        run: node scripts/local-compose-smoke.mjs --bundle artifacts/release-bundle/bundle.json
      - name: Preserve image failure summaries
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-failure-summaries-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/image-*/facts.json
            artifacts/image-*/commands.json
            artifacts/image-*/smoke/result.json
            artifacts/image-*/smoke/commands.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-image-metadata-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release-bundle/metadata/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-images-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release-bundle/
          if-no-files-found: error
          retention-days: 1

  quality:
    name: quality
    needs: [plan, core, browser, images]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: node scripts/artifact-gate.mjs
