name: Rust runtime
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: rust-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_HOME: /tmp/vl-rustup
      CARGO_HOME: /tmp/vl-cargo
      CARGO_TARGET_DIR: artifacts/rust/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0 # The compatibility gate builds a pinned historical API commit.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pinned contract generation tools
        run: pnpm install --frozen-lockfile
      - name: Install checksum-pinned bootstrap and exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vl-rust-installer"
          curl -fsSL https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init -o "$RUNNER_TEMP/vl-rust-installer/rustup-init"
          printf 'b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55  %s\n' "$RUNNER_TEMP/vl-rust-installer/rustup-init" | sha256sum --check
          chmod +x "$RUNNER_TEMP/vl-rust-installer/rustup-init"
          "$RUNNER_TEMP/vl-rust-installer/rustup-init" -y --no-modify-path --profile minimal --default-toolchain 1.99.1 --component rustfmt,clippy
      - name: Format, check, clippy and tests
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_HOME/bin/cargo" fmt --all -- --check
          "$CARGO_HOME/bin/cargo" check --workspace --all-targets --locked
          "$CARGO_HOME/bin/cargo" clippy --workspace --all-targets --locked -- -D warnings
          "$CARGO_HOME/bin/cargo" test --workspace --locked
      - name: Check generated public bindings and cross-language fixtures
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_HOME/bin/cargo" run --locked --package vl-protocol --bin native-codegen -- --check
          pnpm --filter @virtual-city/native-protocol typecheck
          pnpm exec vitest run --project unit packages/native-protocol/test/wire.test.ts
      - name: Check frozen pure reducer replay in independent processes
        run: node crates/vl-game-core/tools/check-replay.mjs
      - name: Check native transactional turn orchestration and process recovery
        shell: bash
        run: |
          set -euo pipefail
          pnpm build:packages
          "$CARGO_HOME/bin/cargo" build --locked --package vl-persistence --example orchestration
          pnpm --filter @virtual-city/platform-api build
          node scripts/with-test-db.mjs node --import tsx scripts/native-game-orchestration.mjs
      - name: Check encrypted journal backup and restored migration integrity
        run: node --import tsx scripts/game-journal-restore-smoke.mjs
      - name: Check direct WSS with real Chromium and restricted PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm build:packages
          "$CARGO_HOME/bin/cargo" build --locked --package vl-gateway --example interop
          node scripts/with-test-db.mjs node --import tsx scripts/native-wss-interop.mjs
      - name: Check actual runtime gameplay and crash recovery
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_HOME/bin/cargo" build --locked --package vl-game-runtime
          node scripts/with-test-db.mjs node --import tsx scripts/native-wss-interop.mjs --runtime-gameplay
      - name: Check Pet Arena PvE matches, recovery and platform settlement
        shell: bash
        run: |
          set -euo pipefail
          node scripts/with-test-db.mjs node --import tsx scripts/native-wss-interop.mjs --pet-arena
          node scripts/with-test-db.mjs node --import tsx scripts/native-wss-interop.mjs --pet-arena-loss
      - name: Check standalone Unity protocol adapter and real C# to Rust interoperability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vl-dotnet"
          curl -fsSL https://builds.dotnet.microsoft.com/dotnet/Sdk/8.0.428/dotnet-sdk-8.0.428-linux-x64.tar.gz -o "$RUNNER_TEMP/vl-dotnet-sdk.tar.gz"
          printf '33212bb99a2bf003973d41106c7e8fe94208a12958ff601d4a476be379403c85a7dc9183a6ec64dfb44ded7102965be09f35add1758e68e9251bae7891d7b7bf  %s\n' "$RUNNER_TEMP/vl-dotnet-sdk.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/vl-dotnet-sdk.tar.gz" -C "$RUNNER_TEMP/vl-dotnet"
          export DOTNET="$RUNNER_TEMP/vl-dotnet/dotnet"
          export PATH="$RUNNER_TEMP/vl-dotnet:$PATH"
          export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
          node scripts/native-csharp.mjs
          node scripts/unity-native-prepare.mjs
          node scripts/with-test-db.mjs node --import tsx scripts/native-wss-interop.mjs --runtime-gameplay --csharp-client
      - name: Measure bounded twenty-actor zone prototype
        run: '"$CARGO_HOME/bin/cargo" run --locked --package vl-world --example zone-probe'
      - name: Check identity-issued runtime ticket trust across Node and Rust
        shell: bash
        run: |
          set -euo pipefail
          pnpm build:packages
          node scripts/with-test-db.mjs pnpm exec tsx --test tests/unit/runtime-tickets.test.ts
          "$CARGO_HOME/bin/cargo" run --locked --package vl-security --bin ticket-check -- artifacts/desktop-first/vl013/tickets.json
          "$CARGO_HOME/bin/cargo" build --locked --package vl-security --bin durable-check
          node scripts/with-test-db.mjs node --import tsx scripts/runtime-admission-durable-check.mjs
      - name: Check native game schema races and archived runtime expansion compatibility
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @virtual-city/platform-api build
          node scripts/with-test-db.mjs pnpm exec vitest run --project integration tests/integration/native-game-schema.test.ts tests/integration/runtime-admission.test.ts tests/integration/schema-compatibility.test.ts
          node scripts/with-test-db.mjs node --import tsx scripts/native-game-migration-compat.mjs
          node scripts/with-test-db.mjs node --import tsx scripts/runtime-admission-migration-compat.mjs
      - name: Build and smoke OCI foundation
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f apps/game-runtime/Dockerfile -t vl-runtime-ci .
          python3 apps/game-runtime/tools/oci-smoke.py vl-runtime-ci
