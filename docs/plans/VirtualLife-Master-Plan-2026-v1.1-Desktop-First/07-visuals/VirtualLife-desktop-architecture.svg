<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-label="VirtualLife desktop first architecture diagram showing Unity native desktop, Next.js official website, Rust game runtime, NestJS platform and PostgreSQL">
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eff8ff"/><stop offset="1" stop-color="#fff0f6"/></linearGradient><linearGradient id="unity" x1="0" x2="1"><stop stop-color="#477dca"/><stop offset="1" stop-color="#7568d6"/></linearGradient><filter id="sh" x="-20%" y="-40%" width="150%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#7799c0" flood-opacity=".22"/></filter></defs>
<rect width="1160" height="690" rx="34" fill="url(#bg)"/>
<text x="60" y="71" font-family="Arial,sans-serif" font-weight="800" font-size="32" fill="#1e3153">VirtualLife — Desktop-First System</text><text x="60" y="105" font-size="17" font-family="Arial,sans-serif" fill="#536b93">World and game authority live in Rust. Graphics and animation run locally in Unity.</text>
<g filter="url(#sh)"><rect x="64" y="153" width="468" height="140" rx="24" fill="url(#unity)"/><rect x="626" y="153" width="468" height="140" rx="24" fill="#fff" stroke="#cbdcf5"/></g>
<text x="95" y="202" font-family="Arial" font-size="25" font-weight="bold" fill="#fff">Unity Windows Desktop</text><text x="95" y="233" font-family="Arial" font-size="17" fill="#eaf4ff">URP shaders · movement · camera · face/ears/tail</text><text x="95" y="257" font-family="Arial" font-size="17" fill="#eaf4ff">Café / card tables / Pet Arena / M map</text>
<text x="660" y="202" font-family="Arial" font-size="25" font-weight="bold" fill="#1e3153">Next.js Official Website</text><text x="660" y="232" font-family="Arial" font-size="17" fill="#537398">Hero/trailer · news · accounts · downloads</text><text x="660" y="258" font-family="Arial" font-size="17" fill="#537398">No mandatory browser open-world renderer</text>
<path d="M296 295 V365 M860 295 V365" fill="none" stroke="#7099cc" stroke-width="5" stroke-dasharray="8 8"/>
<text x="308" y="335" font-family="Arial" font-size="15" fill="#4e709f">WSS: game intents</text><text x="872" y="335" font-family="Arial" font-size="15" fill="#4e709f">HTTPS: portal API</text>
<g filter="url(#sh)"><rect x="64" y="368" width="468" height="154" rx="24" fill="#fff" stroke="#9c98d0" stroke-width="2"/><rect x="626" y="368" width="468" height="154" rx="24" fill="#fff" stroke="#a9d4ce" stroke-width="2"/></g>
<text x="96" y="412" font-family="Arial" font-size="25" font-weight="bold" fill="#6657af">Rust Game Runtime</text><text x="96" y="445" font-family="Arial" font-size="17" fill="#445f89">World actor · AOI · movement · seats</text><text x="96" y="472" font-family="Arial" font-size="17" fill="#445f89">Teleport · cards · Pet Arena · replay</text><text x="96" y="499" font-family="Arial" font-size="14" fill="#6c78ad">Single authoritative writer per world/session</text>
<text x="660" y="412" font-family="Arial" font-size="25" font-weight="bold" fill="#266a69">NestJS Platform Control Plane</text><text x="660" y="445" font-family="Arial" font-size="17" fill="#445f89">Identity · social · moderation · ledger</text><text x="660" y="472" font-family="Arial" font-size="17" fill="#445f89">Async workers · admin · account API</text><text x="660" y="499" font-family="Arial" font-size="14" fill="#438481">No authoritative gameplay calculations</text>
<path d="M536 449 H622" stroke="#8daab7" stroke-width="4" stroke-dasharray="6 5"/><text x="543" y="435" font-family="Arial" font-size="14" fill="#536a87">gRPC / outbox</text>
<path d="M296 523 V575 M860 523 V575" stroke="#7596bd" stroke-width="4" stroke-dasharray="8 8"/>
<g filter="url(#sh)"><rect x="65" y="578" width="1029" height="73" rx="22" fill="#1e3153"/></g>
<text x="93" y="609" font-family="Arial" font-size="23" font-weight="bold" fill="#fff">PostgreSQL</text><text x="93" y="634" font-family="Arial" font-size="16" fill="#cde0ff">Durable game journals + session receipts / independent platform ledger + idempotent outbox/inbox</text>
</svg>
