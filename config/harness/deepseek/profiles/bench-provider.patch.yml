# Headless bench provider overlay.
#
# The shipped headless profile defaults to `deepseek-official`, whose stored key is
# rejected ("api key ****3e46 is invalid"). This overlay points the same headless
# profile at the `thay-phong` OpenAI-Responses-compatible provider the interactive
# desktop session already uses, so an A/B benchmark compares tool presentation
# rather than two different backends.
#
# The key itself is never written here: `apiKeyEnv` names a credential ref that
# dsh-credentials-local resolves from ~/.dsh/.credentials.yaml at boot.
#
# Apply after the profile layer:
#   dsh --profile bench --patch config/harness/profiles/bench-provider.patch.yml "<task>"

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      thay-phong:
        apiKeyEnv: THAY_PHONG_API_KEY
        api: openai-responses
        baseURL: https://9router.phongdang.io.vn/v1
        models:
          - id: deepseek-flash
            name: deepseek-flash
            contextWindow: 1000000
- id: agent-default-model
  config:
    provider: thay-phong
    model: deepseek-flash
