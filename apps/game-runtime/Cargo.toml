[package]
name = "aetheria-game-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["json"] }
tokio.workspace = true
aetheria-gateway = { path = "../../crates/aetheria-gateway" }
aetheria-security = { path = "../../crates/aetheria-security" }
aetheria-game-core = { path = "../../crates/aetheria-game-core" }
aetheria-persistence = { path = "../../crates/aetheria-persistence" }
aetheria-pet-arena = { path = "../../crates/aetheria-pet-arena" }
aetheria-world = { path = "../../crates/aetheria-world" }
aetheria-protocol = { path = "../../crates/aetheria-protocol" }
tokio-postgres = "=0.7.18"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.23.0", features = ["v4", "serde"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
tower.workspace = true

[lints]
workspace = true
