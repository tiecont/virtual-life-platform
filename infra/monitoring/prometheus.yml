# Template only: private collector on the same reviewed stack network.
# No collector,token,external ingestion or public port is provisioned here.
global:
  scrape_interval: 15s
  scrape_timeout: 3s
scrape_configs:
  - job_name: virtual-life-platform
    metrics_path: /internal/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/operator-telemetry-token
    static_configs:
      - targets: ['api:4300']
