name: virtual-city-dev
services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-virtual_city}
      POSTGRES_DB: ${POSTGRES_DB:-virtual_city_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate and export a local password}
    ports: ["127.0.0.1:55452:5432"]
    volumes: ["city-dev:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  city-dev:
