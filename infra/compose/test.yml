services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: aetheria_soulbound_test
      POSTGRES_PASSWORD: ${AETHERIA_TEST_DB_PASSWORD:?Test harness must supply ephemeral password}
      POSTGRES_DB: aetheria_soulbound_test
    ports: ["127.0.0.1::5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aetheria_soulbound_test -d aetheria_soulbound_test"]
      interval: 1s
      timeout: 3s
      retries: 30
